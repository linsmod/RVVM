<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>userland supervisor</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root {
    --bg: #0f1216; --panel: #171c23; --line: #242c36;
    --fg: #d7dde6; --dim: #8b96a5; --acc: #4f9cf9;
    --ok: #3fb96f; --warn: #d9a13c; --bad: #e05a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  header input {
    margin-left: auto; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
    width: 220px; font-size: 12px;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .bar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
  .bar input {
    flex: 0 1 260px; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px;
  }
  button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--acc); color: var(--acc); }
  button.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
  button.primary:hover { color: #fff; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button.active { border-color: var(--acc); color: var(--acc); }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  td button { padding: 4px 10px; font-size: 12px; margin-right: 6px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
  .pill.running, .pill.up    { background: #1d3a2a; color: var(--ok); }
  .pill.starting             { background: #33331c; color: var(--warn); }
  .pill.crashed, .pill.failed, .pill.orphan { background: #3a1d1d; color: var(--bad); }
  .pill.stopped              { background: #22262c; color: var(--dim); }
  .detail {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    margin: 8px 0 4px; padding: 12px 16px;
  }
  .detail pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px; max-height: 320px; overflow: auto; font-size: 12px;
    color: #a8c7e8; white-space: pre-wrap; margin: 8px 0;
  }
  .detail .row { display: flex; gap: 8px; }
  .detail input {
    flex: 1; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px;
    font-family: Consolas, monospace;
  }
  .termbox {
    background: #000; border: 1px solid var(--line); border-radius: 6px;
    padding: 6px; margin: 8px 0; height: 420px;
  }
  .muted { color: var(--dim); font-size: 12px; }
  .ctxmenu {
    position: fixed; z-index: 60; min-width: 190px; padding: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 10px 28px #0009;
  }
  .ctxmenu button {
    display: flex; justify-content: space-between; gap: 18px;
    width: 100%; padding: 7px 10px; border: none; background: none;
    border-radius: 5px; color: var(--fg); font-size: 13px; text-align: left;
  }
  .ctxmenu button:hover { background: var(--bg); color: var(--acc); border-color: transparent; }
  .ctxmenu .k { color: var(--dim); font-size: 11px; }
  #toast {
    position: fixed; right: 20px; bottom: 20px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px;
    display: none; max-width: 420px; font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>userland supervisor</h1>
  <span class="sub" id="health">…</span>
  <input id="token" placeholder="token（未设置则留空）">
</header>
<main>
  <div class="bar">
    <input id="label" placeholder="实例标签（可空）">
    <button class="primary" onclick="startInstance()">启动实例</button>
    <span class="muted">每实例一个独立 rootfs 目录；端口自动分配（7910 起）</span>
  </div>
  <table>
    <thead><tr>
      <th>端口</th><th>状态</th><th>期望</th><th>TCP</th><th>启动时间</th>
      <th>标签</th><th>操作</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="detail"></div>
  <div class="muted" style="margin-top:10px">
    命令与终端经实例自己的 ssh 端点（密钥认证）；guest 内 root 无口令，
    本面板不要暴露到公网。
  </div>
</main>
<div id="toast"></div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
let openPort = null;
let openMode = null;             // "log" | "term"
let termState = null;            // {port, term, fit, ws}

const tokenInput = $("token");
tokenInput.value = localStorage.getItem("us_token") || "";
tokenInput.addEventListener("change", () => {
  localStorage.setItem("us_token", tokenInput.value.trim());
});

function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg;
  t.style.borderColor = bad ? "var(--bad)" : "var(--line)";
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = "none"; }, 4000);
}

// --- context menu ------------------------------------------------------
// A terminal wants Copy / Paste / Select All where the page menu would offer
// "Inspect". Items are plain buttons; the menu closes on any outside click or
// Escape, and is parked inside the viewport.
let ctxMenu = null;

function closeCtxMenu() {
  if (!ctxMenu) return;
  ctxMenu.remove();
  ctxMenu = null;
}

function showCtxMenu(x, y, items) {
  closeCtxMenu();
  const menu = document.createElement("div");
  menu.className = "ctxmenu";
  for (const [label, hint, run] of items) {
    const b = document.createElement("button");
    const l = document.createElement("span");
    l.textContent = label;
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = hint;
    b.append(l, k);
    b.addEventListener("click", () => { closeCtxMenu(); run(); });
    menu.appendChild(b);
  }
  menu.style.left = x + "px";
  menu.style.top = y + "px";
  document.body.appendChild(menu);
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(x, window.innerWidth - r.width - 8)) + "px";
  menu.style.top = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + "px";
  ctxMenu = menu;
}

document.addEventListener("mousedown", (e) => {
  if (ctxMenu && !ctxMenu.contains(e.target)) closeCtxMenu();
}, true);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeCtxMenu();
}, true);

async function api(method, path, body) {
  const headers = {};
  const tok = tokenInput.value.trim();
  if (tok) headers["Authorization"] = "Bearer " + tok;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const r = await fetch(path, {
    method, headers,
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}

function pill(cls) { return `<span class="pill ${cls}">${cls}</span>`; }

async function health() {
  try {
    const d = await api("GET", "/api/health");
    const cores = Object.keys(d.cores || {}).length;
    $("health").textContent =
      `daemon ${d.version} · ${d.release.split(/[\\/]/).pop()} · 注册 core ${cores}`;
  } catch (e) {
    $("health").textContent = "daemon 不可达：" + e.message;
  }
}

function closeTerminal() {
  if (!termState) return;
  closeCtxMenu();
  try { termState.ws.close(); } catch (e) {}
  try { termState.term.dispose(); } catch (e) {}
  termState = null;
}

function openDetail(port, mode) {
  if (openPort === port && openMode === mode) return;
  closeTerminal();
  openPort = port;
  openMode = mode;
  renderDetail(port);
  if (mode === "log") loadLog(port);
  else openTerminal(port);
}

function toggleDetail(port, mode) {
  if (openPort === port && openMode === mode) { closeDetail(); return; }
  openDetail(port, mode);
}

function closeDetail() {
  closeTerminal();
  openPort = null;
  openMode = null;
  $("detail").innerHTML = "";
}

function renderDetail(port) {
  if (openPort !== port || !openMode) return;
  if (openMode === "log") {
    $("detail").innerHTML = `
      <div class="detail">
        <div class="muted">实例 ${port} · 日志（3s 刷新）· 命令在实例内执行（回车发送）</div>
        <pre id="log-${port}">日志加载中…</pre>
        <div class="row">
          <input id="cmd-${port}" placeholder="如：ls / 或 cat /etc/hostname"
                 onkeydown="if(event.key==='Enter')exec(${port})">
          <button class="primary" onclick="exec(${port})">执行</button>
        </div>
      </div>`;
  } else {
    $("detail").innerHTML = `
      <div class="detail">
        <div class="muted">实例 ${port} · 交互终端（密钥认证的 ssh 会话）·
          Ctrl+Shift+C 复制（选中也可直接 Ctrl+C）· Ctrl+V / Ctrl+Shift+V 粘贴 ·
          Ctrl+C 中断 · 右键菜单</div>
        <div class="termbox" id="term-${port}"></div>
        <button onclick="closeDetail()">关闭终端</button>
      </div>`;
  }
}

async function refresh() {
  let inst = [];
  try {
    inst = (await api("GET", "/api/instances")).instances || [];
  } catch (e) {
    $("rows").innerHTML =
      `<tr><td colspan="7" class="muted">加载失败：${e.message}</td></tr>`;
    return;
  }
  const alive = inst.some((i) => i.port === openPort);
  if (openPort !== null && !alive) {
    // The instance is gone (deleted / fell out of the registry): the detail
    // panel would sit on dead endpoints forever.
    closeDetail();
  }
  $("rows").innerHTML = inst.length ? "" :
    `<tr><td colspan="7" class="muted">没有实例</td></tr>`;
  for (const i of inst) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i.port}</td>
      <td>${pill(i.actual)}</td>
      <td class="muted">${i.desired}</td>
      <td>${i.tcp ? "●" : "·"}</td>
      <td class="muted">${i.started_at || "-"}</td>
      <td>${i.label || "-"}</td>
      <td>
        <button class="${openPort === i.port && openMode === "log" ? "active" : ""}"
                onclick="toggleDetail(${i.port}, 'log')">日志 / 命令</button>
        <button class="${openPort === i.port && openMode === "term" ? "active" : ""}"
                onclick="toggleDetail(${i.port}, 'term')">终端</button>
        <button onclick="stopInstance(${i.port})">停止</button>
        <button class="danger" onclick="rmInstance(${i.port})">删除</button>
      </td>`;
    $("rows").appendChild(tr);
    if (i.port === openPort && openMode === "log") loadLog(i.port);
  }
}

async function loadLog(port) {
  const el = document.getElementById("log-" + port);
  if (!el) return;
  try {
    const d = await api("GET", `/api/instances/${port}/log?tail=80`);
    el.textContent = (d.log || []).join("\n") || "（日志为空）";
    el.scrollTop = el.scrollHeight;
  } catch (e) {
    el.textContent = "日志读取失败：" + e.message;
  }
}

function openTerminal(port) {
  const container = document.getElementById("term-" + port);
  if (!container || termState) return;
  const term = new Terminal({ cursorBlink: true, fontFamily: "Consolas, monospace" });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(container);
  fit.fit();
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const tok = tokenInput.value.trim();
  const ws = new WebSocket(
    `${proto}://${location.host}/ws/${port}?token=${encodeURIComponent(tok)}` +
    `&cols=${term.cols}&rows=${term.rows}`);
  ws.binaryType = "arraybuffer";
  ws.onmessage = (e) => term.write(new Uint8Array(e.data));
  ws.onclose = () => term.write("\r\n\x1b[90m[连接已关闭]\x1b[0m");
  ws.onerror = () => term.write("\r\n\x1b[31m[连接错误]\x1b[0m");

  const send = (s) => {
    if (ws.readyState === 1) ws.send(new TextEncoder().encode(s));
  };
  term.onData((d) => send(d));

  // --- clipboard -------------------------------------------------------
  // Clipboard policy is the embedder's; xterm.js supplies the pieces and we
  // only route keys through its documented extension point:
  //   Ctrl+Shift+C, or Ctrl+C while text is selected .. copy the selection
  //   Ctrl+V / Ctrl+Shift+V ........................... paste (browser event;
  //                                                      Shift+Insert too,
  //                                                      where the browser
  //                                                      maps that key)
  //   Ctrl+C with nothing selected ................... ^C (SIGINT)
  // Paste is never read by hand: the browser's paste event lands on xterm's
  // textarea and xterm turns it into pty input (CRLF -> CR, ESC sanitising,
  // bracketed paste when the remote program asked for it). The context menu
  // is the one path with no paste event, so it reads the clipboard and hands
  // the text to term.paste(), which applies exactly the same treatment.
  const copyText = (text) => {
    if (!text) return;
    if (!(navigator.clipboard && navigator.clipboard.writeText)) {
      toast("此浏览器不提供剪贴板写入", true);
      return;
    }
    navigator.clipboard.writeText(text).catch(() => toast("复制失败：浏览器拒绝写剪贴板", true));
  };
  const copySelection = () => copyText(term.getSelection());
  const pasteFromClipboard = () => {
    if (!(navigator.clipboard && navigator.clipboard.readText)) {
      toast("此浏览器不提供剪贴板读取，请用 Ctrl+V", true);
      return;
    }
    navigator.clipboard.readText().then((text) => {
      if (text) { term.paste(text); term.focus(); }
    }).catch(() => toast("剪贴板读取被拒绝，请用 Ctrl+V / Ctrl+Shift+V", true));
  };

  term.attachCustomKeyEventHandler((ev) => {
    if (ev.type !== "keydown" || ev.altKey || ev.metaKey) return true;
    if (ev.ctrlKey && ev.code === "KeyC" && (ev.shiftKey || term.hasSelection())) {
      // Ctrl+Shift+C is the Linux copy chord; plain Ctrl+C keeps the console
      // habit of copying when text is selected, and is a plain ^C otherwise.
      copySelection();
      return false;
    }
    if (ev.ctrlKey && !ev.shiftKey && ev.code === "KeyV") {
      // Handled by xterm this keydown emits ^V and cancels the browser's
      // paste; dropping the event leaves the paste to the browser.
      return false;
    }
    return true;
  });

  container.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    // Snapshot the selection: opening the menu blurs the terminal.
    const sel = term.getSelection();
    showCtxMenu(e.clientX, e.clientY, [
      ["复制", "Ctrl+Shift+C", () => {
        if (!sel) { toast("没有选中内容"); return; }
        copyText(sel);
      }],
      ["粘贴", "Ctrl+V", pasteFromClipboard],
      ["全选", "", () => term.selectAll()],
    ]);
  });

  termState = { port, term, fit, ws };
  term.focus();
}

async function startInstance() {
  try {
    const d = await api("POST", "/api/instances",
                        { label: $("label").value.trim() || null });
    toast(d.actual === "running"
          ? `实例已启动：端口 ${d.port}`
          : `实例 ${d.actual}：端口 ${d.port}`, d.actual !== "running");
    refresh();
  } catch (e) { toast("启动失败：" + e.message, true); }
}

async function stopInstance(port) {
  try { await api("POST", `/api/instances/${port}/stop`, {});
        toast(`已停止：端口 ${port}`); refresh(); }
  catch (e) { toast("停止失败：" + e.message, true); }
}

async function rmInstance(port) {
  if (!confirm(`删除实例 ${port}？其 rootfs 目录会一并清除。`)) return;
  try { await api("DELETE", `/api/instances/${port}`);
        toast(`已删除：端口 ${port}`); refresh(); }
  catch (e) { toast("删除失败：" + e.message, true); }
}

async function exec(port) {
  const input = document.getElementById("cmd-" + port);
  const pre = document.getElementById("log-" + port);
  const cmd = input.value.trim();
  if (!cmd || !pre) return;
  input.value = "";
  pre.textContent += "\n$ " + cmd + "\n（执行中…）";
  try {
    const d = await api("POST", `/api/instances/${port}/exec`, { cmd });
    let out = d.stdout || "";
    if (d.stderr) out += "\n[stderr] " + d.stderr;
    out += `\n[exit ${d.exit}]`;
    pre.textContent = pre.textContent.replace("\n（执行中…）", "") + "\n" +
      out.trim() + "\n";
    pre.scrollTop = pre.scrollHeight;
  } catch (e) {
    pre.textContent = pre.textContent.replace("\n（执行中…）", "") +
      "\n执行失败：" + e.message + "\n";
  }
}

refresh();
health();
setInterval(refresh, 3000);
setInterval(() => { if (openPort !== null && openMode === "log") loadLog(openPort); },
            3000);
setInterval(health, 10000);
</script>
</body>
</html>
