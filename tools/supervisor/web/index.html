<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>userland supervisor</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171c23; --line: #242c36;
    --fg: #d7dde6; --dim: #8b96a5; --acc: #4f9cf9;
    --ok: #3fb96f; --warn: #d9a13c; --bad: #e05a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  header input {
    margin-left: auto; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
    width: 220px; font-size: 12px;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .bar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
  .bar input {
    flex: 0 1 260px; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px;
  }
  button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--acc); color: var(--acc); }
  button.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
  button.primary:hover { color: #fff; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  td button { padding: 4px 10px; font-size: 12px; margin-right: 6px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
  .pill.running, .pill.up    { background: #1d3a2a; color: var(--ok); }
  .pill.starting             { background: #33331c; color: var(--warn); }
  .pill.crashed, .pill.failed, .pill.orphan { background: #3a1d1d; color: var(--bad); }
  .pill.stopped              { background: #22262c; color: var(--dim); }
  .detail {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    margin: 8px 0 4px; padding: 12px 16px;
  }
  .detail pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px; max-height: 320px; overflow: auto; font-size: 12px;
    color: #a8c7e8; white-space: pre-wrap; margin: 8px 0;
  }
  .detail .row { display: flex; gap: 8px; }
  .detail input {
    flex: 1; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px;
    font-family: Consolas, monospace;
  }
  .muted { color: var(--dim); font-size: 12px; }
  #toast {
    position: fixed; right: 20px; bottom: 20px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px;
    display: none; max-width: 420px; font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>userland supervisor</h1>
  <span class="sub" id="health">…</span>
  <input id="token" placeholder="token（未设置则留空）">
</header>
<main>
  <div class="bar">
    <input id="label" placeholder="实例标签（可空）">
    <button class="primary" onclick="startInstance()">启动实例</button>
    <span class="muted">每实例一个独立 rootfs 目录；端口自动分配（7910 起）</span>
  </div>
  <table>
    <thead><tr>
      <th>端口</th><th>状态</th><th>期望</th><th>TCP</th><th>启动时间</th>
      <th>标签</th><th>操作</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="muted" style="margin-top:10px">
    命令经实例自己的 ssh 端点（vpshhd → tinysshnoneauthd）执行；guest 内没有鉴权，
    本面板不要暴露到公网。
  </div>
</main>
<div id="toast"></div>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
let openPort = null;
let openTab = "log";

const tokenInput = $("token");
tokenInput.value = localStorage.getItem("us_token") || "";
tokenInput.addEventListener("change", () => {
  localStorage.setItem("us_token", tokenInput.value.trim());
});

function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg;
  t.style.borderColor = bad ? "var(--bad)" : "var(--line)";
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = "none"; }, 4000);
}

async function api(method, path, body) {
  const headers = {};
  const tok = tokenInput.value.trim();
  if (tok) headers["Authorization"] = "Bearer " + tok;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const r = await fetch(path, {
    method, headers,
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
}

function pill(cls) { return `<span class="pill ${cls}">${cls}</span>`; }

async function health() {
  try {
    const d = await api("GET", "/api/health");
    const cores = Object.keys(d.cores || {}).length;
    $("health").textContent =
      `daemon ${d.version} · ${d.release.split(/[\\/]/).pop()} · 注册 core ${cores}`;
  } catch (e) {
    $("health").textContent = "daemon 不可达：" + e.message;
  }
}

async function refresh() {
  let inst = [];
  try {
    inst = (await api("GET", "/api/instances")).instances || [];
  } catch (e) {
    $("rows").innerHTML =
      `<tr><td colspan="7" class="muted">加载失败：${e.message}</td></tr>`;
    return;
  }
  $("rows").innerHTML = inst.length ? "" :
    `<tr><td colspan="7" class="muted">没有实例</td></tr>`;
  for (const i of inst) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i.port}</td>
      <td>${pill(i.actual)}</td>
      <td class="muted">${i.desired}</td>
      <td>${i.tcp ? "●" : "·"}</td>
      <td class="muted">${i.started_at || "-"}</td>
      <td>${i.label || "-"}</td>
      <td>
        <button onclick="toggleDetail(${i.port})">日志 / 命令</button>
        <button onclick="stopInstance(${i.port})">停止</button>
        <button class="danger" onclick="rmInstance(${i.port})">删除</button>
      </td>`;
    $("rows").appendChild(tr);
    if (i.port === openPort) {
      const d = document.createElement("tr");
      d.innerHTML = `<td colspan="7" style="padding:0 12px 12px">
        ${detailHtml(i.port)}</td>`;
      $("rows").appendChild(d);
      const input = document.getElementById("cmd-" + i.port);
      if (input) input.focus();
      loadLog(i.port);
    }
  }
}

function detailHtml(port) {
  return `
    <div class="detail">
      <div class="muted">实例 ${port} · 日志（3s 刷新）· 命令在实例内执行（回车发送）</div>
      <pre id="log-${port}">日志加载中…</pre>
      <div class="row">
        <input id="cmd-${port}" placeholder="如：ls / 或 cat /etc/hostname"
               onkeydown="if(event.key==='Enter')exec(${port})">
        <button class="primary" onclick="exec(${port})">执行</button>
      </div>
    </div>`;
}

async function loadLog(port) {
  const el = document.getElementById("log-" + port);
  if (!el) return;
  try {
    const d = await api("GET", `/api/instances/${port}/log?tail=80`);
    el.textContent = (d.log || []).join("\n") || "（日志为空）";
    el.scrollTop = el.scrollHeight;
  } catch (e) {
    el.textContent = "日志读取失败：" + e.message;
  }
}

function toggleDetail(port) {
  openPort = (openPort === port) ? null : port;
  refresh();
}

async function startInstance() {
  try {
    const d = await api("POST", "/api/instances",
                        { label: $("label").value.trim() || null });
    toast(d.actual === "running"
          ? `实例已启动：端口 ${d.port}`
          : `实例 ${d.actual}：端口 ${d.port}`, d.actual !== "running");
    refresh();
  } catch (e) { toast("启动失败：" + e.message, true); }
}

async function stopInstance(port) {
  try { await api("POST", `/api/instances/${port}/stop`, {});
        toast(`已停止：端口 ${port}`); refresh(); }
  catch (e) { toast("停止失败：" + e.message, true); }
}

async function rmInstance(port) {
  if (!confirm(`删除实例 ${port}？其 rootfs 目录会一并清除。`)) return;
  try { await api("DELETE", `/api/instances/${port}`);
        toast(`已删除：端口 ${port}`);
        if (openPort === port) openPort = null;
        refresh(); }
  catch (e) { toast("删除失败：" + e.message, true); }
}

async function exec(port) {
  const input = document.getElementById("cmd-" + port);
  const pre = document.getElementById("log-" + port);
  const cmd = input.value.trim();
  if (!cmd || !pre) return;
  input.value = "";
  pre.textContent += "\n$ " + cmd + "\n（执行中…）";
  try {
    const d = await api("POST", `/api/instances/${port}/exec`, { cmd });
    let out = d.stdout || "";
    if (d.stderr) out += "\n[stderr] " + d.stderr;
    out += `\n[exit ${d.exit}]`;
    pre.textContent = pre.textContent.replace("\n（执行中…）", "") + "\n" +
      out.trim() + "\n";
    pre.scrollTop = pre.scrollHeight;
  } catch (e) {
    pre.textContent = pre.textContent.replace("\n（执行中…）", "") +
      "\n执行失败：" + e.message + "\n";
  }
}

refresh();
health();
setInterval(refresh, 3000);
setInterval(() => { if (openPort !== null) loadLog(openPort); }, 3000);
setInterval(health, 10000);
</script>
</body>
</html>
