# Project-wide Gradle settings.
android.useAndroidX=true
android.enableJetifier=true

# compileSdk 35 is intentional; silence AGP 8.5.x's "tested up to 34" notice
android.suppressUnsupportedCompileSdk=35

# No daemon. A Gradle daemon outlives the build that started it, so a stale one
# keeps a JVM (and its locks on the build tree) around after the build is done,
# and the next build inherits whatever it left behind instead of the tree as it
# is on disk. Set here rather than as a --no-daemon on the Makefile's gradle
# lines so it holds for a hand-run ./gradlew too, which is the invocation that
# is hardest to notice inheriting the state.
org.gradle.daemon=false
